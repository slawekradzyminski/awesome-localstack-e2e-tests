name: Commerce e2e

# Runs the whole suite (api, ui, journeys) against a fresh awesome-localstack
# lightweight profile: published images of backend, payment-service,
# warehouse-service and frontend, started the same way awesome-localstack's own CI does.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      localstack_ref:
        description: awesome-localstack ref (branch, tag or SHA) that pins the images
        default: main

concurrency:
  group: commerce-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # The suite is CPU bound in CI: 827 tests add up to about 45 minutes of test time, and four
    # workers share a 4-core runner with the stack they test (11.6 min for the run). Four jobs,
    # each with its own stack, cut the wall time to roughly the slowest job plus 1.5 min of setup.
    # Plain --shard=N/3 put every browser test in the last shard (238 s against 69 s), so the API
    # project and the browser projects are halved separately.
    name: e2e (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api-1, args: '--project=api --shard=1/2' }
          - { name: api-2, args: '--project=api --shard=2/2' }
          - { name: ui-1, args: '--project=ui --project=journeys --shard=1/2' }
          - { name: ui-2, args: '--project=ui --project=journeys --shard=2/2' }
    runs-on: ubuntu-latest
    # An unsharded run took 16 min; 15 min per job stops a hung stack or test run early.
    timeout-minutes: 15
    env:
      APP_BASE_URL: http://127.0.0.1:8081
      CI: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history so the next step can diff against the previous main head.
          fetch-depth: 0

      # A change that touches only Markdown (README, AGENTS.md, bugs/*.md) cannot change a
      # test result, so the 13-minute stack run is skipped. The job still concludes
      # success. Anything not comparable (manual run, first push) runs everything.
      - name: Classify the changed files
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          files=""
          if [[ "$EVENT" == pull_request ]]; then
            # The checked-out merge commit: first parent is the base branch.
            files="$(git diff --name-only HEAD^1 HEAD)"
          elif [[ "$EVENT" == push && -n "$BEFORE" ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          fi
          run=true
          if [[ -n "$files" ]]; then
            if ! grep -qvE '(^|/)[^/]+\.md$' <<<"$files"; then run=false; fi
          fi
          printf '%s\n' "$files" | sed 's/^/  /'
          echo "run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        if: steps.changes.outputs.run == 'true'
        with:
          repository: slawekradzyminski/awesome-localstack
          ref: ${{ inputs.localstack_ref || 'main' }}
          path: localstack

      - uses: actions/setup-node@v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      # The image pull (~20 s, network bound) overlaps with npm ci and the Chromium install.
      - name: Install dependencies and Chromium, pull the stack images meanwhile
        if: steps.changes.outputs.run == 'true'
        run: |
          (cd localstack && docker compose -f lightweight-docker-compose.yml pull --quiet --ignore-buildable) &
          pull_pid=$!
          npm ci
          npx playwright install chromium --with-deps
          wait "$pull_pid"

      # Static checks do not depend on the shard, so one job runs them.
      - name: Typecheck and lint
        if: steps.changes.outputs.run == 'true' && matrix.name == 'api-1'
        run: npm run check

      - name: Start the lightweight stack
        if: steps.changes.outputs.run == 'true'
        working-directory: localstack
        run: |
          docker compose -f lightweight-docker-compose.yml up -d --wait --wait-timeout 300
          curl --fail --silent --show-error http://127.0.0.1:8081/payment/v3/api-docs >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8081/warehouse/v3/api-docs >/dev/null

      - name: Run the suite
        if: steps.changes.outputs.run == 'true'
        run: npx playwright test ${{ matrix.args }}

      - name: Stack logs on failure
        if: ${{ failure() && steps.changes.outputs.run == 'true' }}
        working-directory: localstack
        run: |
          docker compose -f lightweight-docker-compose.yml ps --all
          docker compose -f lightweight-docker-compose.yml logs --no-color --tail=300

      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
